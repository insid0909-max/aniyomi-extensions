name: 티비위키 타이머 호환성 오류 수정
on:
  push:
    branches: [master]
    paths: ['.github/workflows/tvwiki-timer-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 실제 환경과 같은 타이머 부재 조건 검사와 수정
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');

          const vm=require('node:vm'),assert=require('node:assert/strict');
          async function check(helper){let cases=0;for(const mode of ['no-clear','promise-timer','no-timers']){const c={};if(mode!=='no-timers')c.setTimeout=mode==='promise-timer'?(fn,ms)=>new Promise(resolve=>setTimeout(()=>{fn();resolve()},ms)):(fn,ms)=>{setTimeout(fn,ms)};vm.createContext(c);vm.runInContext(helper+';globalThis.run=wait;',c);assert.equal(vm.runInContext('typeof clearTimeout',c),'undefined');assert.equal(await c.run(Promise.resolve('성공'),10),'성공');cases++;const original=Error('원래 통신 오류');await assert.rejects(c.run(Promise.reject(original),10),e=>e===original);cases++;if(mode!=='no-timers'){await assert.rejects(c.run(new Promise(()=>{}),1),/요청 시간이 길어/);cases++;await assert.rejects(c.run(new Promise(resolve=>setTimeout(resolve,20)),1),/요청 시간이 길어/);cases++}}await new Promise(resolve=>setTimeout(resolve,30));return cases}

          (async()=>{const file='mangayomi/javascript/anime/src/ko/tvwiki.js',before=fs.readFileSync(file,'utf8'),b=Buffer.from(before),sha=crypto.createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');assert.equal(sha,'95882e0d5cffd964521d688d54a7f7ab986e7168','원본이 바뀌었습니다. 재검토가 필요합니다.');const pattern=/^function wait\(p,ms\)\{[^\n]*\}$/m,prior=before.match(pattern)?.[0];assert(prior&&prior.includes('clearTimeout(t)'));const replacement='function wait(p,ms){if(typeof setTimeout!=="function")return Promise.resolve(p);let settled=false;const timer=new Promise((_,bad)=>{setTimeout(()=>{if(!settled)bad(Error("요청 시간이 길어 중단했습니다. 잠시 뒤 다시 시도해 주세요."))},ms)});return Promise.race([Promise.resolve(p),timer]).finally(()=>{settled=true})}';await check(replacement);const after=before.replace(pattern,replacement).replace(/version:\s*["']1\.0\.9["']/,'version:"1.0.10"');assert(!after.includes('clearTimeout('));const mask=s=>s.replace(pattern,'TIMER').replace(/version:\s*["']1\.0\.(?:9|10)["']/,'VERSION');assert.equal(mask(before),mask(after),'시간 제한과 버전 외 변경 금지');const tmp=file+'.check.js';fs.writeFileSync(tmp,after);try{cp.execFileSync(process.execPath,['--check',tmp],{stdio:'inherit'})}finally{fs.unlinkSync(tmp)}const index=JSON.parse(fs.readFileSync('mangayomi/anime_index.json','utf8')),row=index.find(x=>x.id===1720450905);assert(row&&row.version==='1.0.9');row.version='1.0.10';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/aniyomi-extensions/master/mangayomi/javascript/anime/src/ko/tvwiki.js?v=1.0.10';const notes=JSON.parse(fs.readFileSync('changelog.json','utf8')),{addNote,render}=require('./mangayomi/tools/monitor/changelog.js');addNote(notes,'tvwiki','2026-11-08','1.0.10: 앱에 없는 clearTimeout 호출로 목록이 실패하던 오류 수정. 취소 함수 없이 완료 여부를 확인하고, setTimeout도 없으면 통신 자체 timeout 사용. clearTimeout을 주입하지 않은 성공·실패·시간 초과 검사 통과. 실제 기기 목록·재생은 확인 필요.');fs.writeFileSync(file,after);fs.writeFileSync('mangayomi/anime_index.json',JSON.stringify(index,null,1)+'\n');fs.writeFileSync('changelog.json',JSON.stringify(notes,null,1)+'\n');fs.writeFileSync('업데이트내역.md',render(notes));fs.appendFileSync('mangayomi/tools/tvwiki-rules-checklist.md','\n## 1.0.10 타이머 호환성 수정\n\nclearTimeout 없는 환경, Promise를 반환하는 setTimeout 환경, 두 타이머 모두 없는 환경을 검사합니다. 성공과 원래 통신 오류를 보존하며 타이머가 있을 때 시간 초과와 늦은 완료를 검사합니다. 타이머 자체가 없으면 Client의 통신 timeout에 맡깁니다. 실기기 동작 확인은 별도입니다.\n');console.log('티비위키 타이머 호환성 검사 10개 통과·1.0.10 갱신')})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: 검사된 수정만 반영
        run: |
          node --check mangayomi/javascript/anime/src/ko/tvwiki.js
          git config user.name "insid0909-max"
          git config user.email "266083559+insid0909-max@users.noreply.github.com"
          git add -- mangayomi/javascript/anime/src/ko/tvwiki.js mangayomi/anime_index.json changelog.json 업데이트내역.md mangayomi/tools/tvwiki-rules-checklist.md
          git diff --cached --check
          git commit -m "티비위키 1.0.10 타이머 미지원 오류 수정"
          git push origin HEAD:master
