name: Generate Repo Index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Index & Signatures
        run: |
          # 1. anime 폴더 구성 및 인덱스 복제
          mkdir -p anime
          cp index.min.json anime/index.min.json

          # 2. APK 서명 지문(SHA-256) 자동 추출
          APK_FILE=$(ls apk/*.apk | head -n 1)
          echo "Extracting fingerprint from $APK_FILE..."
          FINGERPRINT=$(keytool -printcert -jarfile "$APK_FILE" | grep "SHA256:" | head -n 1 | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Found Fingerprint: $FINGERPRINT"

          # 3. 규격에 맞춘 repo.json 재작성
          cat <<EOF > repo.json
          {
            "meta": {
              "name": "내 애니요미 확장",
              "shortName": "TVroom",
              "website": "https://github.com/insid0909-max/aniyomi-extensions",
              "signingKeyFingerprint": "$FINGERPRINT"
            }
          }
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add anime/index.min.json repo.json
          git commit -m "Auto-generate repo index and signing key" || exit 0
          git push origin gh-pages
