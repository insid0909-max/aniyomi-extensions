name: 티비위키 인증 화면 오인 수정
on:
  push:
    branches: [master]
    paths: ['.github/workflows/tvwiki-challenge-check-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 정상 회차와 실제 확인 화면 구분 검사
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const vm=require('node:vm'),assert=require('node:assert/strict');
          function verify(fn){const c={};vm.createContext(c);vm.runInContext(fn+';globalThis.block=blocked;',c);const rows=[
          [200,'<title>나는 SOLO</title><div class="bo_v_tit">나는 SOLO</div><li data-ep-idx="1"><a class="title ep-link" href="/ent/100/1">1회</a></li><script src="https://www.google.com/recaptcha/api.js"></script>',false],
          [200,'<title>작품</title><div class="g-recaptcha"></div><li data-ep-idx="2">2회</li>',false],
          [200,'<title>목록</title><script>var note="cf-chl captcha Just a moment";</script><div class="box">작품</div>',false],
          [200,'<title>CAPTCHA가 등장하는 작품</title><div class="bo_v_tit">제목</div>',false],
          [200,'<title>Just a moment...</title><script>window._cf_chl_opt={};</script>',true],
          [403,'<title>Attention Required! | Cloudflare</title>',true],
          [403,'<form id="challenge-form"></form><script>window._cf_chl_opt={};</script>',true],
          [503,'<div id="challenge-stage"></div><script>_cf_chl_opt={};</script>',true],
          [403,'<title>접근 거부</title>',false],
          [503,'<title>서비스 점검</title><script src="/captcha.js"></script>',false],
          [451,'법적 사유로 제한',true],
          [200,'<title>정상 회차</title><li data-ep-idx="1">1회</li>',false]
          ];for(const [statusCode,body,expect]of rows)assert.equal(c.block({statusCode,body}),expect);return rows.length}

          (async()=>{const file='mangayomi/javascript/anime/src/ko/tvwiki.js',before=fs.readFileSync(file,'utf8'),b=Buffer.from(before),sha=crypto.createHash('sha1').update('blob '+b.length+'\0').update(b).digest('hex');assert.equal(sha,'a60e2e696d6da6327dc8ef6b89d9f90b0296cede','원본이 바뀌어 재검토가 필요합니다.');const pattern=/^function blocked\(r\)\{[^\n]*\}$/m;assert(before.match(pattern)?.[0].includes('Just a moment|cf-chl|captcha'));const replacement="function blocked(r){const status=Number(r?.statusCode),b=String(r?.body||'');if(status===451)return true;const title=/<title\\b[^>]*>([\\s\\S]*?)<\\/title\\s*>/i.exec(b)?.[1].replace(/\\s+/g,' ').trim()||'';if(/^(?:Just a moment\\b|Attention Required!.*Cloudflare|Access denied.*Cloudflare)/i.test(title))return true;return [403,503].includes(status)&&/<(?:form|div)\\b[^>]*\\bid=[\"']challenge-(?:form|stage)[\"']/i.test(b)&&/(?:window\\.)?_cf_chl_opt\\s*=/.test(b)}";assert.equal(verify(replacement),12);const after=before.replace(pattern,replacement).replace(/version:\s*["']1\.0\.10["']/,'version:"1.0.11"');const mask=s=>s.replace(pattern,'CHALLENGE_CHECK').replace(/version:\s*["']1\.0\.(?:10|11)["']/,'VERSION');assert.equal(mask(before),mask(after),'인증 화면 판정과 버전 외 변경 금지');const tmp=file+'.check.js';fs.writeFileSync(tmp,after);try{cp.execFileSync(process.execPath,['--check',tmp],{stdio:'inherit'})}finally{fs.unlinkSync(tmp)}const index=JSON.parse(fs.readFileSync('mangayomi/anime_index.json','utf8')),row=index.find(x=>x.id===1720450905);assert(row&&row.version==='1.0.10');row.version='1.0.11';row.sourceCodeUrl='https://raw.githubusercontent.com/insid0909-max/aniyomi-extensions/master/mangayomi/javascript/anime/src/ko/tvwiki.js?v=1.0.11';const notes=JSON.parse(fs.readFileSync('changelog.json','utf8')),{addNote,render}=require('./mangayomi/tools/monitor/changelog.js');addNote(notes,'tvwiki','2026-11-08','1.0.11: 정상 페이지의 captcha 위젯·스크립트 글자만 보고 인증 화면으로 오인하던 판정 수정. 실제 확인 화면 제목·상태·폼으로 구분하며 HTTP 오류 처리는 유지. 회차·재생 코드는 변경 없음. 모의 화면 12개 검사 통과·실제 기기 회차 복구는 확인 필요.');fs.writeFileSync(file,after);fs.writeFileSync('mangayomi/anime_index.json',JSON.stringify(index,null,1)+'\n');fs.writeFileSync('changelog.json',JSON.stringify(notes,null,1)+'\n');fs.writeFileSync('업데이트내역.md',render(notes));fs.appendFileSync('mangayomi/tools/tvwiki-rules-checklist.md','\n## 1.0.11 인증 화면 오인 수정\n\n정상 페이지의 captcha 위젯·스크립트·작품 제목은 차단 근거로 쓰지 않습니다. 실제 확인 화면 제목이나 403/503 확인 폼과 설정을 함께 확인합니다. 451 제한·HTTP 오류 처리는 유지합니다. 모의 화면 12개 검사이며 사용자 기기에서 받은 실제 HTML을 검증한 것은 아닙니다. 회차·재생 코드는 변경하지 않습니다.\n');console.log('인증 화면 오인 검사 12개 통과·티비위키 1.0.11 갱신')})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: 검사된 판정 수정만 반영
        run: |
          node --check mangayomi/javascript/anime/src/ko/tvwiki.js
          git config user.name "insid0909-max"
          git config user.email "266083559+insid0909-max@users.noreply.github.com"
          git add -- mangayomi/javascript/anime/src/ko/tvwiki.js mangayomi/anime_index.json changelog.json 업데이트내역.md mangayomi/tools/tvwiki-rules-checklist.md
          git diff --cached --check
          git commit -m "티비위키 1.0.11 정상 회차 화면의 인증 오류 오인 수정"
          git push origin HEAD:master
