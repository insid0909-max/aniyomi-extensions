name: 티비위키 공통 규칙 적용과 검사
on:
  push:
    branches: [master]
    paths:
      - 'mangayomi/tools/apply-tvwiki-rules.cjs'
      - '.github/workflows/tvwiki-rules-once.yml'
permissions:
  contents: write
concurrency:
  group: tvwiki-rules-once
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 기준 파일 확인과 규칙 적용
        run: node mangayomi/tools/apply-tvwiki-rules.cjs
      - name: 실제 생성 소스 구문과 모의 입력 검사
        run: |
          node --check mangayomi/javascript/anime/src/ko/tvwiki.js
          node mangayomi/tools/apply-tvwiki-rules.cjs --test
          node mangayomi/tools/monitor/changelog.js changelog.json 업데이트내역.md
      - name: 허용한 파일만 기록
        run: |
          git config user.name "insid0909-max"
          git config user.email "266083559+insid0909-max@users.noreply.github.com"
          git add -- mangayomi/javascript/anime/src/ko/tvwiki.js mangayomi/anime_index.json domains.json changelog.json 업데이트내역.md mangayomi/domains.json mangayomi/changelog.json mangayomi/tools/tvwiki-rules-checklist.md
          git diff --cached --check
          git commit -m "티비위키 1.0.9 공통 규칙 보완과 검사 기록"
          test "$(git log -1 --format=%ae)" = "266083559+insid0909-max@users.noreply.github.com"
          test "$(git log -1 --format=%ce)" = "266083559+insid0909-max@users.noreply.github.com"
          git push origin HEAD:master
