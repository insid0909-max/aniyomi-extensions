name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK Build-Tools
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip pillow

      - name: Prepare fixed signing key
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore.jks"
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -alias aniyomi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "aniyomi123" \
            -keypass "aniyomi123" \
            -dname "CN=aniyomi, OU=aniyomi, O=aniyomi, L=Seoul, ST=Seoul, C=KR"
          
          SIGNING_KEY=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias aniyomi -storepass "aniyomi123" | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SIGNING_KEY=$SIGNING_KEY" >> $GITHUB_ENV
          echo "Fixed Fingerprint: $SIGNING_KEY"

      - name: Auto bump version code in build.gradle
        run: |
          # 빌드할 때마다 현재 build_number(고유 증가 번호) + 300으로 APK 내부 버전을 강제 교체
          TARGET_VCODE=$(( ${{ github.run_number }} + 300 ))
          echo "Setting extVersionCode to $TARGET_VCODE"
          sed -i -E "s/extVersionCode\s*=\s*[0-9]+/extVersionCode = $TARGET_VCODE/g" src/ko/tvroom/build.gradle
          grep "extVersionCode" src/ko/tvroom/build.gradle

      - name: Build extensions
        env:
          CI_SIGNING_KEY: keystore.jks
          CI_SIGNING_KEY_ALIAS: aniyomi
          CI_SIGNING_KEY_PASSWORD: aniyomi123
          CI_SIGNING_STORE_PASSWORD: aniyomi123
          SIGNING_STORE_PASSWORD: aniyomi123
          SIGNING_KEY_PASSWORD: aniyomi123
          SIGNING_KEY_ALIAS: aniyomi
        run: |
          ./gradlew clean :src:ko:tvroom:assembleRelease \
            -x lintKotlin -x lint \
            -PsigningStorePassword="aniyomi123" \
            -PsigningKeyPassword="aniyomi123" \
            -PsigningKeyAlias="aniyomi" \
            -PsigningStoreFile="$GITHUB_WORKSPACE/keystore.jks" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore.jks" \
            -Pandroid.injected.signing.store.password="aniyomi123" \
            -Pandroid.injected.signing.key.alias="aniyomi" \
            -Pandroid.injected.signing.key.password="aniyomi123" \
            --stacktrace

      - name: Prepare repo and auto-generate index
        run: |
          mkdir -p repo/anime repo/apk repo/icon
          
          if [ -d "functions" ]; then
            cp -rv functions repo/
          fi

          python3 - << 'EOF'
          import os, glob, subprocess, json, hashlib
          from PIL import Image

          repo_dir = "repo"
          signing_key = os.environ.get("SIGNING_KEY", "")

          repo_data = {
              "meta": {
                  "name": "TVroom Repository",
                  "shortName": "TVroom",
                  "website": "https://aniyomi-extensions.pages.dev",
                  "signingKeyFingerprint": signing_key
              }
          }
          for sub in ["", "anime"]:
              p = os.path.join(repo_dir, sub, "repo.json") if sub else os.path.join(repo_dir, "repo.json")
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(repo_data, f, ensure_ascii=False, indent=2)

          apk_files = glob.glob("src/**/build/outputs/apk/release/*.apk", recursive=True)
          extensions = []

          for apk in apk_files:
              badging = subprocess.check_output(["aapt", "dump", "badging", apk]).decode("utf-8", errors="ignore")
              pkg = None
              vcode = None
              vname = None

              for line in badging.splitlines():
                  if line.startswith("package:"):
                      for part in line.split():
                          if part.startswith("name='"):
                              pkg = part.split("'")[1]
                          elif part.startswith("versionCode='"):
                              vcode = int(part.split("'")[1])
                          elif part.startswith("versionName='"):
                              vname = part.split("'")[1]

              if not pkg:
                  continue

              display_name = "티비위키"
              base_domain = "https://tvwiki51.net"

              target_name = f"aniyomi-{pkg}-v{vname}-release.apk"
              for dest in [repo_dir, os.path.join(repo_dir, "anime"), os.path.join(repo_dir, "apk")]:
                  subprocess.run(["cp", "-v", apk, os.path.join(dest, target_name)])

              # 아이콘 추출
              icon_path_in_apk = None
              for line in badging.splitlines():
                  if "application-icon-" in line or "icon='" in line:
                      icon_path_in_apk = line.split("'")[-2]
              
              icon_file = f"{pkg}.png"
              if icon_path_in_apk:
                  unzip_cmd = f"unzip -p '{apk}' '{icon_path_in_apk}' > '{os.path.join(repo_dir, 'icon', icon_file)}'"
                  subprocess.run(unzip_cmd, shell=True)
                  for dest in [repo_dir, os.path.join(repo_dir, "anime")]:
                      subprocess.run(["cp", "-v", os.path.join(repo_dir, 'icon', icon_file), os.path.join(dest, icon_file)])

              # 아이콘 투명화
              full_icon = os.path.join(repo_dir, icon_file)
              if os.path.exists(full_icon):
                  try:
                      img = Image.open(full_icon).convert("RGBA")
                      datas = img.getdata()
                      new_data = [(255, 255, 255, 0) if (d[0]>180 and d[1]>180 and d[2]>180) else d for d in datas]
                      img.putdata(new_data)
                      img.save(full_icon, "PNG")
                  except Exception as e:
                      print(f"Icon error: {e}")

              # Tachiyomi 공식 소스 ID 해시 계산
              key = f"{display_name}/ko/1".encode("utf-8")
              digest = hashlib.md5(key).digest()
              source_id = str(int.from_bytes(digest[:8], byteorder="little", signed=True) & 0x7FFFFFFFFFFFFFFF)

              apk_size = os.path.getsize(os.path.join(repo_dir, target_name))

              # sed로 실제 주입된 APK 내부 versionCode와 완벽 일치
              extensions.append({
                  "name": display_name,
                  "pkg": pkg,
                  "apk": target_name,
                  "lang": "ko",
                  "code": vcode,
                  "version": vname,
                  "nsfw": 1,
                  "hasReadme": 0,
                  "hasChangelog": 0,
                  "size": apk_size,
                  "icon": icon_file,
                  "sources": [
                      {
                          "name": display_name,
                          "lang": "ko",
                          "id": source_id,
                          "baseUrl": base_domain,
                          "versionId": 1
                      }
                  ]
              })

          for p in [os.path.join(repo_dir, "index.min.json"), os.path.join(repo_dir, "anime", "index.min.json")]:
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(extensions, f, ensure_ascii=False, separators=(',', ':'))

          print(f"총 {len(extensions)}개 확장 앱 인덱싱 완료")
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
