name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare signing key
        run: |
          keytool -genkey -v -keystore signing-key.jks -alias aniyomi -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=aniyomi, OU=aniyomi, O=aniyomi, L=Unknown, S=Unknown, C=Unknown"

      - name: Build extensions
        env:
          CI_CHUNK_NUM: 0
          CI_CHUNK_SIZE: 1
          CI_SIGNING_KEY: signing-key.jks
          CI_SIGNING_KEY_ALIAS: aniyomi
          CI_SIGNING_KEY_PASSWORD: password
          CI_SIGNING_STORE_PASSWORD: password
        run: ./gradlew assembleRelease --continue || true

      - name: Prepare repo and index
        run: |
          mkdir -p repo/apk
          # 빌드된 tvroom APK를 repo/apk 폴더로 복사
          find . -name "*.apk" -type f ! -path "./repo/*" -exec cp {} repo/apk/ \;
          
          # Aniyomi 공식 규격에 맞는 index.min.json 직접 생성
          cat << 'EOF' > generate_index.py
          import os, json, hashlib

          repo_dir = "repo"
          apk_dir = os.path.join(repo_dir, "apk")
          extensions = []

          if os.path.exists(apk_dir):
              for f in os.listdir(apk_dir):
                  if f.endswith(".apk") and "tvroom" in f:
                      apk_path = os.path.join(apk_dir, f)
                      with open(apk_path, "rb") as fp:
                          digest = hashlib.sha256(fp.read()).hexdigest()
                      extensions.append({
                          "name": "Aniyomi: Movie",
                          "pkg": "eu.kanade.tachiyomi.animeextension.ko.tvroom",
                          "apk": f"apk/{f}",
                          "lang": "ko",
                          "code": 1,
                          "version": "14.1",
                          "nsfw": 0,
                          "sources": [
                              {
                                  "name": "영화",
                                  "lang": "ko",
                                  "id": "2135778533207260895",
                                  "baseUrl": "https://tvwiki51.net",
                                  "versionId": 1
                              }
                          ]
                      })

          with open(os.path.join(repo_dir, "index.min.json"), "w", encoding="utf-8") as fp:
              json.dump(extensions, fp, ensure_ascii=False)
          EOF

          python3 generate_index.py
          ls -la repo/
          ls -la repo/apk/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
