name: CI

on:
  push:
    branches:
      - master
    # 망가요미 저장소나 설명 문서만 바뀐 경우에는 확장앱을 다시 배포하지 않음
    paths-ignore:
      - 'mangayomi/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK Build-Tools
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip pillow

      # 영구 고정 키스토어 보장 (없으면 최초 1회 생성 후 Git에 커밋, 있으면 그대로 재사용)
      - name: Ensure permanent signing key file
        run: |
          KEYSTORE_FILE="signingkey.jks"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "영구 서명 키 파일이 없으므로 최초 1회 생성합니다."
            keytool -genkeypair \
              -alias aniyomikey \
              -keypass "aniyomi123" \
              -keystore "$KEYSTORE_FILE" \
              -storepass "aniyomi123" \
              -dname "CN=AniyomiExtension, OU=Extension, O=Aniyomi, L=Seoul, ST=Seoul, C=KR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype PKCS12
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_FILE"
            git commit -m "chore: persist permanent signing key [skip ci]" || true
            git push origin master || true
          else
            echo "기존 영구 서명 키 파일을 재사용합니다."
          fi

          SIGNING_KEY=$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias aniyomikey -storepass "aniyomi123" | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SIGNING_KEY=$SIGNING_KEY" >> $GITHUB_ENV
          echo "Fixed Fingerprint: $SIGNING_KEY"

      - name: Calculate auto version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BASE_OFFSET=4300
          AUTO_VCODE=$((BASE_OFFSET + COMMIT_COUNT))
          if [ $AUTO_VCODE -le 4387 ]; then
            AUTO_VCODE=4388
          fi
          echo "AUTO_VCODE=$AUTO_VCODE" >> $GITHUB_ENV
          echo "Target Version Code: $AUTO_VCODE (Target versionName: 14.$AUTO_VCODE)"

      # build.gradle.kts 파일의 extVersionCode와 extCode를 AUTO_VCODE 숫자로 명확히 치환 (tvroom, livesports 적용)
      - name: Inject version into build.gradle
        run: |
          TARGET_FILES=("src/ko/tvroom/build.gradle.kts" "src/ko/livesports/build.gradle.kts")
          for TARGET_FILE in "${TARGET_FILES[@]}"; do
            if [ -f "$TARGET_FILE" ]; then
              sed -i -E "s/val extCode\s*=\s*[0-9]+/val extCode = $AUTO_VCODE/g" "$TARGET_FILE"
              sed -i -E "s/set\(\"extVersionCode\".*\)/set\(\"extVersionCode\", $AUTO_VCODE\)/" "$TARGET_FILE"
              echo "치환 결과 확인 ($TARGET_FILE):"
              grep -E "extVersionCode|extCode" "$TARGET_FILE" || true
            fi
          done

      - name: Build extensions
        run: |
          mkdir -p src/ko/livesports/build src/ko/tvroom/build
          ./gradlew :src:ko:tvroom:assembleRelease :src:ko:livesports:assembleRelease \
            -PextVersionCode=${{ env.AUTO_VCODE }} \
            -x lintKotlin -x lint \
            -PsigningStorePassword="aniyomi123" \
            -PsigningKeyPassword="aniyomi123" \
            -PsigningKeyAlias="aniyomikey" \
            -PsigningStoreFile="$GITHUB_WORKSPACE/signingkey.jks" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signingkey.jks" \
            -Pandroid.injected.signing.store.password="aniyomi123" \
            -Pandroid.injected.signing.key.alias="aniyomikey" \
            -Pandroid.injected.signing.key.password="aniyomi123" \
            --stacktrace

      - name: Prepare repo and auto-generate index
        run: |
          mkdir -p repo/anime repo/apk repo/icon
          
          if [ -d "functions" ]; then
            cp -rv functions repo/
          fi

          python3 - << 'EOF'
          import os, glob, subprocess, json

          repo_dir = "repo"
          signing_key = os.environ.get("SIGNING_KEY", "")

          repo_data = {
              "meta": {
                  "name": "TVroom Repository",
                  "shortName": "TVroom",
                  "website": "https://aniyomi-extensions.pages.dev",
                  "signingKeyFingerprint": signing_key
              }
          }
          for sub in ["", "anime"]:
              p = os.path.join(repo_dir, sub, "repo.json") if sub else os.path.join(repo_dir, "repo.json")
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(repo_data, f, ensure_ascii=False, indent=2)

          apk_files = glob.glob("src/**/build/outputs/apk/release/*.apk", recursive=True)
          extensions = []

          for apk in apk_files:
              badging = subprocess.check_output(["aapt", "dump", "badging", apk]).decode("utf-8", errors="ignore")
              pkg = None
              vcode = None
              vname = None
              label = None

              for line in badging.splitlines():
                  if line.startswith("package:"):
                      for part in line.split():
                          if part.startswith("name='"):
                              pkg = part.split("'")[1]
                          elif part.startswith("versionCode='"):
                              vcode = int(part.split("'")[1])
                          elif part.startswith("versionName='"):
                              vname = part.split("'")[1]
                  elif line.startswith("application-label:"):
                      label = line.split("'")[1]

              if not pkg or not vcode or not vname:
                  continue

              display_name = label if label else "Extension"
              source_name = label if label else "Extension"
              target_name = f"aniyomi-{pkg}-v{vname}-release.apk"

              for dest in [repo_dir, os.path.join(repo_dir, "anime"), os.path.join(repo_dir, "apk")]:
                  subprocess.run(["cp", "-v", apk, os.path.join(dest, target_name)])

              icon_file = f"{pkg}.png"
              icon_path_in_apk = None
              for line in badging.splitlines():
                  if "application-icon-" in line or "icon='" in line:
                      icon_path_in_apk = line.split("'")[-2]
              
              if icon_path_in_apk:
                  unzip_cmd = f"unzip -p '{apk}' '{icon_path_in_apk}' > '{os.path.join(repo_dir, 'icon', icon_file)}'"
                  subprocess.run(unzip_cmd, shell=True)
                  for dest in [repo_dir, os.path.join(repo_dir, "anime")]:
                      subprocess.run(["cp", "-v", os.path.join(repo_dir, 'icon', icon_file), os.path.join(dest, icon_file)])

              apk_size = os.path.getsize(os.path.join(repo_dir, target_name))

              extensions.append({
                  "name": display_name,
                  "pkg": pkg,
                  "apk": target_name,
                  "lang": "ko",
                  "code": vcode,
                  "version": vname,
                  "nsfw": 1,
                  "hasReadme": 0,
                  "hasChangelog": 0,
                  "size": apk_size,
                  "icon": icon_file,
                  "sources": [
                      {
                          "name": source_name,
                          "lang": "ko",
                          "id": str(abs(hash(pkg))),
                          "baseUrl": "",
                          "versionId": 1
                      }
                  ]
              })

          for p in [os.path.join(repo_dir, "index.min.json"), os.path.join(repo_dir, "anime", "index.min.json")]:
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(extensions, f, ensure_ascii=False, separators=(',', ':'))

          print(f"총 {len(extensions)}개 확장 인덱싱 완료")
          EOF

          cat << 'HEADER_EOF' > repo/_headers
          /*
            Access-Control-Allow-Origin: *

          /*.json
            Cache-Control: no-cache, no-store, must-revalidate, max-age=0, s-maxage=0
            CDN-Cache-Control: no-store
            Cloudflare-CDN-Cache-Control: no-store

          /anime/*.json
            Cache-Control: no-cache, no-store, must-revalidate, max-age=0, s-maxage=0
            CDN-Cache-Control: no-store
            Cloudflare-CDN-Cache-Control: no-store
          HEADER_EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
