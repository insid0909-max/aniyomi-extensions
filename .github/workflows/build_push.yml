name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK Build-Tools
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip pillow

      - name: Prepare fixed signing key
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/debug.keystore"
          rm -f "$KEYSTORE_PATH"
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12
          
          SIGNING_KEY=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -storepass android | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SIGNING_KEY=$SIGNING_KEY" >> $GITHUB_ENV
          echo "Fixed Fingerprint: $SIGNING_KEY"

      - name: Calculate auto version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BASE_OFFSET=4300
          AUTO_VCODE=$((BASE_OFFSET + COMMIT_COUNT))
          
          if [ $AUTO_VCODE -le 4387 ]; then
            AUTO_VCODE=4388
          fi
          
          echo "AUTO_VCODE=$AUTO_VCODE" >> $GITHUB_ENV
          echo "Target Version Code: $AUTO_VCODE (Target versionName: 14.$AUTO_VCODE)"

      # Kotlin DSL (.kts) 및 일반 Groovy build.gradle의 버전 코드/이름을 정밀 치환
      - name: Inject version into build.gradle
        run: |
          find . -type f -name "build.gradle*" | grep -i "tvroom" | while read -r file; do
            echo "Injecting version $AUTO_VCODE into $file"
            sed -i -E "s/extVersionCode\s*=\s*[0-9]+/extVersionCode = $AUTO_VCODE/g" "$file"
            sed -i -E "s/extVersion\s*=\s*[\"'][^\"']+[\"']/extVersion = \"$AUTO_VCODE\"/g" "$file" || true
            sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = $AUTO_VCODE/g" "$file" || true
            sed -i -E "s/versionName\s*=\s*[\"'][^\"']+[\"']/versionName = \"14.$AUTO_VCODE\"/g" "$file" || true
          done

      - name: Build extensions
        run: |
          ./gradlew clean :src:ko:tvroom:assembleRelease \
            -PextVersionCode=${{ env.AUTO_VCODE }} \
            -x lintKotlin -x lint \
            -PsigningStorePassword="android" \
            -PsigningKeyPassword="android" \
            -PsigningKeyAlias="androiddebugkey" \
            -PsigningStoreFile="$GITHUB_WORKSPACE/debug.keystore" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/debug.keystore" \
            -Pandroid.injected.signing.store.password="android" \
            -Pandroid.injected.signing.key.alias="androiddebugkey" \
            -Pandroid.injected.signing.key.password="android" \
            --stacktrace

      - name: Prepare repo and auto-generate index
        run: |
          mkdir -p repo/anime repo/apk repo/icon
          
          if [ -d "functions" ]; then
            cp -rv functions repo/
          fi

          python3 - << 'EOF'
          import os, glob, subprocess, json

          repo_dir = "repo"
          signing_key = os.environ.get("SIGNING_KEY", "")

          repo_data = {
              "meta": {
                  "name": "TVroom Repository",
                  "shortName": "TVroom",
                  "website": "https://aniyomi-extensions.pages.dev",
                  "signingKeyFingerprint": signing_key
              }
          }
          for sub in ["", "anime"]:
              p = os.path.join(repo_dir, sub, "repo.json") if sub else os.path.join(repo_dir, "repo.json")
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(repo_data, f, ensure_ascii=False, indent=2)

          apk_files = glob.glob("src/**/build/outputs/apk/release/*.apk", recursive=True)
          extensions = []

          for apk in apk_files:
              badging = subprocess.check_output(["aapt", "dump", "badging", apk]).decode("utf-8", errors="ignore")
              pkg = None
              vcode = None
              vname = None
              label = None

              for line in badging.splitlines():
                  if line.startswith("package:"):
                      for part in line.split():
                          if part.startswith("name='"):
                              pkg = part.split("'")[1]
                          elif part.startswith("versionCode='"):
                              vcode = int(part.split("'")[1])
                          elif part.startswith("versionName='"):
                              vname = part.split("'")[1]
                  elif line.startswith("application-label:"):
                      label = line.split("'")[1]

              if not pkg or not vcode or not vname:
                  continue

              display_name = label if label else "TVroom"
              source_name = "TVroom"
              base_domain = "https://tvwiki51.net"
              target_name = f"aniyomi-{pkg}-v{vname}-release.apk"

              for dest in [repo_dir, os.path.join(repo_dir, "anime"), os.path.join(repo_dir, "apk")]:
                  subprocess.run(["cp", "-v", apk, os.path.join(dest, target_name)])

              icon_file = f"{pkg}.png"
              icon_path_in_apk = None
              for line in badging.splitlines():
                  if "application-icon-" in line or "icon='" in line:
                      icon_path_in_apk = line.split("'")[-2]
              
              if icon_path_in_apk:
                  unzip_cmd = f"unzip -p '{apk}' '{icon_path_in_apk}' > '{os.path.join(repo_dir, 'icon', icon_file)}'"
                  subprocess.run(unzip_cmd, shell=True)
                  for dest in [repo_dir, os.path.join(repo_dir, "anime")]:
                      subprocess.run(["cp", "-v", os.path.join(repo_dir, 'icon', icon_file), os.path.join(dest, icon_file)])

              apk_size = os.path.getsize(os.path.join(repo_dir, target_name))

              extensions.append({
                  "name": display_name,
                  "pkg": pkg,
                  "apk": target_name,
                  "lang": "ko",
                  "code": vcode,
                  "version": vname,
                  "nsfw": 1,
                  "hasReadme": 0,
                  "hasChangelog": 0,
                  "size": apk_size,
                  "icon": icon_file,
                  "sources": [
                      {
                          "name": source_name,
                          "lang": "ko",
                          "id": "7894561230123456789",
                          "baseUrl": base_domain,
                          "versionId": 1
                      }
                  ]
              })

          for p in [os.path.join(repo_dir, "index.min.json"), os.path.join(repo_dir, "anime", "index.min.json")]:
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(extensions, f, ensure_ascii=False, separators=(',', ':'))

          print(f"인덱싱 완료 -> Name: {display_name}, Version: {vname}, Code: {vcode}, Pkg: {pkg}")
          EOF

          cat << 'HEADER_EOF' > repo/_headers
          /*
            Access-Control-Allow-Origin: *
          /index.min.json
            Cache-Control: no-cache, no-store, must-revalidate, max-age=0, s-maxage=0
            CDN-Cache-Control: no-store
          /anime/index.min.json
            Cache-Control: no-cache, no-store, must-revalidate, max-age=0, s-maxage=0
            CDN-Cache-Control: no-store
          /repo.json
            Cache-Control: no-cache, no-store, must-revalidate, max-age=0, s-maxage=0
            CDN-Cache-Control: no-store
          HEADER_EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
