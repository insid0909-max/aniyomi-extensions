name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK Build-Tools
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip pillow

      - name: Prepare fixed signing key
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore.jks"
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -alias aniyomi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "aniyomi123" \
            -keypass "aniyomi123" \
            -dname "CN=aniyomi, OU=aniyomi, O=aniyomi, L=Seoul, ST=Seoul, C=KR"
          
          SIGNING_KEY=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias aniyomi -storepass "aniyomi123" | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SIGNING_KEY=$SIGNING_KEY" >> $GITHUB_ENV
          echo "Fixed Fingerprint: $SIGNING_KEY"

      - name: Build extensions
        env:
          CI_CHUNK_NUM: 0
          CI_CHUNK_SIZE: 1
          CI_SIGNING_KEY: keystore.jks
          CI_SIGNING_KEY_ALIAS: aniyomi
          CI_SIGNING_KEY_PASSWORD: aniyomi123
          CI_SIGNING_STORE_PASSWORD: aniyomi123
          SIGNING_STORE_PASSWORD: aniyomi123
          SIGNING_KEY_PASSWORD: aniyomi123
          SIGNING_KEY_ALIAS: aniyomi
        run: |
          ./gradlew clean :src:ko:tvroom:assembleRelease \
            -PsigningStorePassword="aniyomi123" \
            -PsigningKeyPassword="aniyomi123" \
            -PsigningKeyAlias="aniyomi" \
            -PsigningStoreFile="$GITHUB_WORKSPACE/keystore.jks" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore.jks" \
            -Pandroid.injected.signing.store.password="aniyomi123" \
            -Pandroid.injected.signing.key.alias="aniyomi" \
            -Pandroid.injected.signing.key.password="aniyomi123" \
            --stacktrace

      - name: Prepare repo and auto-generate index
        run: |
          mkdir -p repo/anime repo/apk repo/icon
          
          if [ -d "functions" ]; then
            cp -rv functions repo/
          fi
          
          ORIG_APK=$(find . -name "*.apk" -type f ! -path "./repo/*" | head -n 1)
          echo "Found APK: $ORIG_APK"
          
          BADGING=$(aapt dump badging "$ORIG_APK")
          
          REAL_PKG=$(echo "$BADGING" | grep -oP "package: name='\K[^']+")
          REAL_VCODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")
          REAL_VNAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          
          echo "Auto Version - Pkg: $REAL_PKG, Code: $REAL_VCODE, Version: $REAL_VNAME"
          
          TARGET_APK="aniyomi-ko.tvroom-v${REAL_VNAME}-release.apk"
          cp -v "$ORIG_APK" "repo/$TARGET_APK"
          cp -v "$ORIG_APK" "repo/anime/$TARGET_APK"
          cp -v "$ORIG_APK" "repo/apk/$TARGET_APK"
          
          ICON_SRC=$(echo "$BADGING" | grep -oP "application-icon-[0-9]+:'\K[^']+" | tail -n 1)
          if [ -z "$ICON_SRC" ]; then
            ICON_SRC=$(echo "$BADGING" | grep -oP "application: label='.*?' icon='\K[^']+")
          fi
          
          if [ -n "$ICON_SRC" ]; then
            unzip -p "$ORIG_APK" "$ICON_SRC" > "repo/icon/${REAL_PKG}.png" || true
            cp -v "repo/icon/${REAL_PKG}.png" "repo/${REAL_PKG}.png" || true
            cp -v "repo/icon/${REAL_PKG}.png" "repo/anime/${REAL_PKG}.png" || true
          fi

          # 아이콘 배경 자동 투명화 처리
          python3 - << 'EOF'
          import glob
          from PIL import Image

          def process_icon(img_path):
              try:
                  img = Image.open(img_path).convert("RGBA")
                  datas = img.getdata()
                  new_data = []
                  for item in datas:
                      # 밝은 픽셀(체크무늬 흰색/연회색 영역)을 완전 투명 처리
                      if item[0] > 180 and item[1] > 180 and item[2] > 180:
                          new_data.append((255, 255, 255, 0))
                      else:
                          new_data.append(item)
                  img.putdata(new_data)
                  img.save(img_path, "PNG")
                  print(f"투명화 완료: {img_path}")
              except Exception as e:
                  print(f"투명화 실패 ({img_path}): {e}")

          for icon in glob.glob("repo/**/*.png", recursive=True):
              process_icon(icon)
          EOF

          # 인덱스 생성
          python3 - << EOF
          import os, json, hashlib

          repo_dir = "repo"
          signing_key = os.environ.get("SIGNING_KEY", "")
          target_apk = "$TARGET_APK"
          real_pkg = "$REAL_PKG"
          real_vcode = int("$REAL_VCODE")
          real_vname = "$REAL_VNAME"
          apk_path = os.path.join(repo_dir, target_apk)
          apk_size = os.path.getsize(apk_path) if os.path.exists(apk_path) else 0

          repo_data = {
              "meta": {
                  "name": "TVroom Repository",
                  "shortName": "TVroom",
                  "website": "https://aniyomi-extensions.pages.dev",
                  "signingKeyFingerprint": signing_key
              }
          }
          with open(os.path.join(repo_dir, "repo.json"), "w", encoding="utf-8") as f:
              json.dump(repo_data, f, ensure_ascii=False, indent=2)
          with open(os.path.join(repo_dir, "anime", "repo.json"), "w", encoding="utf-8") as f:
              json.dump(repo_data, f, ensure_ascii=False, indent=2)

          key = "티비위키/ko/1".encode("utf-8")
          digest = hashlib.md5(key).digest()
          source_id = str(int.from_bytes(digest[:8], byteorder="little", signed=True) & 0x7FFFFFFFFFFFFFFF)

          extensions = [{
              "name": "TVroom",
              "pkg": real_pkg,
              "apk": target_apk,
              "lang": "ko",
              "code": real_vcode,
              "version": real_vname,
              "nsfw": 1,
              "hasReadme": 0,
              "hasChangelog": 0,
              "size": apk_size,
              "icon": f"{real_pkg}.png",
              "sources": [
                  {
                      "name": "티비위키",
                      "lang": "ko",
                      "id": source_id,
                      "baseUrl": "https://tvwiki51.net",
                      "versionId": 1
                  }
              ]
          }]

          for p in [os.path.join(repo_dir, "index.min.json"), os.path.join(repo_dir, "anime", "index.min.json")]:
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(extensions, f, ensure_ascii=False, separators=(',', ':'))

          print(f"배포 완료: 이름 TVroom, 버전 {real_vname} (code: {real_vcode}), 패키지명: {real_pkg}")
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
