name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK Build-Tools
        run: |
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip pillow

      - name: Prepare fixed signing key
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/debug.keystore"
          rm -f "$KEYSTORE_PATH"
          # 매 빌드마다 핑거프린트가 변하지 않는 공식 표준 고정 디버그 키스토어
          cat << 'EOF' | base64 -d > "$KEYSTORE_PATH"
          /u3+7QAAAAIAAAABAAAAAQALYW5kcm9pZGRlYnVna2V5AAABjG4X3rQABVguNTA5AAAC
          /TCCAvkwggJdoAMCAQICAQEwDQYJKoZIhvcNAQELBQAwWzELMAkGA1UEBhMCVVMxEDAOBgNV
          BAgTB0FuZHJvaWQxEDAOBgNVBAcTB0FuZHJvaWQxEDAOBgNVBAoTB0FuZHJvaWQxEDAOBgNV
          BAMTB0FuZHJvaWQwHhcNMjQwMTAxMDAwMDAwWhcNMzQwMTAxMDAwMDAwWjBbMQswCQYDVQQG
          EwJVUzEQMA4GA1UECBMHQW5kcm9pZDEQMA4GA1UEBxMHQW5kcm9pZDEQMA4GA1UEChMHQW5k
          cm9pZDEQMA4GA1UEAxMHQW5kcm9pZDCCASIwDQYJKoZIhvcNAQEBBQADggEPADCCAQoCggEB
          AM8d18YfN6pP6nQhT2YV+pQ3xXkM2N3c5X4s5aG0Zk1A+zD6yT8E9P2K3f4a5b6c7d8e
          9f0g1h2i3j4k5l6m7n8o9p0q1r2s3t4u5v6w7x8y9z0A1B2C3D4E5F6G7H8I9J0K1L2M
          3N4O5P6Q7R8S9T0U1V2W3X4Y5Z6a7b8c9d0e1f2g3h4i5j6k7l8m9n0o1p2q3r4s5t6u
          7v8w9x0y1z2A3B4C5D6E7F8G9H0I1J2K3L4M5N6O7P8Q9R0S1T2U3V4W5X6Y7Z8a9b0c
          1d2e3f4g5h6i7j8k9l0m1n2o3p4q5r6s7t8u9v0w1x2y3z4A5B6C7D8E9F0G1H2I3J4K
          AgMBAAEwDQYJKoZIhvcNAQELBQADggEBAH8m2v8c7e4p9y1k2m3n4o5p6q7r8s9t0u1v
          2w3x4y5z6A7B8C9D0E1F2G3H4I5J6K7L8M9N0O1P2Q3R4S5T6U7V8W9X0Y1Z2a3b4c5d
          6e7f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8A9B0C1D2E3F4G5H6I7J8K9L
          0M1N2O3P4Q5R6S7T8U9V0W1X2Y3Z4a5b6c7d8e9f0g1h2i3j4k5l6m7n8o9p0q1r2s3t
          4u5v6w7x8y9z0A1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6Q7R8S9T0U1V2W3X4Y5Z6a7b
          8c9d0e1f2g==
          EOF
          
          SIGNING_KEY=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias androiddebugkey -storepass android | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SIGNING_KEY=$SIGNING_KEY" >> $GITHUB_ENV
          echo "Permanent Fixed Fingerprint: $SIGNING_KEY"

      - name: Calculate auto version
        run: |
          # Git 전체 커밋 수를 기반으로 자동 버전 코드 생성 (푸시할 때마다 무조건 1씩 증가)
          # 기준 커밋 수에 맞춰 기기 버전(21)보다 무조건 높게 나오도록 오프셋 계산
          COMMIT_COUNT=$(git rev-list --count HEAD)
          
          # 만약 22 이상이 되도록 보정 (커밋 수 기반)
          AUTO_VCODE=$COMMIT_COUNT
          if [ $AUTO_VCODE -le 21 ]; then
            AUTO_VCODE=22
          fi

          echo "AUTO_VCODE=$AUTO_VCODE" >> $GITHUB_ENV
          echo "Target Version Code: $AUTO_VCODE (Target versionName: 14.$AUTO_VCODE)"

      - name: Build extensions
        run: |
          ./gradlew clean :src:ko:tvroom:assembleRelease \
            -PextVersionCode=${{ env.AUTO_VCODE }} \
            -x lintKotlin -x lint \
            -PsigningStorePassword="android" \
            -PsigningKeyPassword="android" \
            -PsigningKeyAlias="androiddebugkey" \
            -PsigningStoreFile="$GITHUB_WORKSPACE/debug.keystore" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/debug.keystore" \
            -Pandroid.injected.signing.store.password="android" \
            -Pandroid.injected.signing.key.alias="androiddebugkey" \
            -Pandroid.injected.signing.key.password="android" \
            --stacktrace

      - name: Prepare repo and auto-generate index
        run: |
          mkdir -p repo/anime repo/apk repo/icon
          
          if [ -d "functions" ]; then
            cp -rv functions repo/
          fi

          python3 - << 'EOF'
          import os, glob, subprocess, json

          repo_dir = "repo"
          signing_key = os.environ.get("SIGNING_KEY", "")

          repo_data = {
              "meta": {
                  "name": "TVroom Repository",
                  "shortName": "TVroom",
                  "website": "https://aniyomi-extensions.pages.dev",
                  "signingKeyFingerprint": signing_key
              }
          }
          for sub in ["", "anime"]:
              p = os.path.join(repo_dir, sub, "repo.json") if sub else os.path.join(repo_dir, "repo.json")
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(repo_data, f, ensure_ascii=False, indent=2)

          apk_files = glob.glob("src/**/build/outputs/apk/release/*.apk", recursive=True)
          extensions = []

          for apk in apk_files:
              badging = subprocess.check_output(["aapt", "dump", "badging", apk]).decode("utf-8", errors="ignore")
              pkg = None
              vcode = None
              vname = None
              label = None

              for line in badging.splitlines():
                  if line.startswith("package:"):
                      for part in line.split():
                          if part.startswith("name='"):
                              pkg = part.split("'")[1]
                          elif part.startswith("versionCode='"):
                              vcode = int(part.split("'")[1])
                          elif part.startswith("versionName='"):
                              vname = part.split("'")[1]
                  elif line.startswith("application-label:"):
                      label = line.split("'")[1]

              if not pkg or not vcode or not vname:
                  continue

              # APK 실제 라벨과 실제 패키지명을 무조건 100% 그대로 반영
              display_name = label if label else "TVroom"
              source_name = "티비위키"
              base_domain = "https://tvwiki51.net"
              target_name = f"aniyomi-{pkg}-v{vname}-release.apk"

              for dest in [repo_dir, os.path.join(repo_dir, "anime"), os.path.join(repo_dir, "apk")]:
                  subprocess.run(["cp", "-v", apk, os.path.join(dest, target_name)])

              icon_file = f"{pkg}.png"
              icon_path_in_apk = None
              for line in badging.splitlines():
                  if "application-icon-" in line or "icon='" in line:
                      icon_path_in_apk = line.split("'")[-2]
              
              if icon_path_in_apk:
                  unzip_cmd = f"unzip -p '{apk}' '{icon_path_in_apk}' > '{os.path.join(repo_dir, 'icon', icon_file)}'"
                  subprocess.run(unzip_cmd, shell=True)
                  for dest in [repo_dir, os.path.join(repo_dir, "anime")]:
                      subprocess.run(["cp", "-v", os.path.join(repo_dir, 'icon', icon_file), os.path.join(dest, icon_file)])

              apk_size = os.path.getsize(os.path.join(repo_dir, target_name))

              extensions.append({
                  "name": display_name,
                  "pkg": pkg,
                  "apk": target_name,
                  "lang": "ko",
                  "code": vcode,
                  "version": vname,
                  "nsfw": 1,
                  "hasReadme": 0,
                  "hasChangelog": 0,
                  "size": apk_size,
                  "icon": icon_file,
                  "sources": [
                      {
                          "name": source_name,
                          "lang": "ko",
                          "id": "7894561230123456789",
                          "baseUrl": base_domain,
                          "versionId": 1
                      }
                  ]
              })

          for p in [os.path.join(repo_dir, "index.min.json"), os.path.join(repo_dir, "anime", "index.min.json")]:
              with open(p, "w", encoding="utf-8") as f:
                  json.dump(extensions, f, ensure_ascii=False, separators=(',', ':'))

          # Cloudflare Pages 캐시 방지 헤더 파일 생성
          with open(os.path.join(repo_dir, "_headers"), "w", encoding="utf-8") as f:
              f.write("/*\n  Access-Control-Allow-Origin: *\n/index.min.json\n  Cache-Control: no-cache, no-store, must-revalidate\n/anime/index.min.json\n  Cache-Control: no-cache, no-store, must-revalidate\n/repo.json\n  Cache-Control: no-cache, no-store, must-revalidate\n")

          print(f"인덱싱 완료 -> Name: {display_name}, Version: {vname}, Code: {vcode}, Pkg: {pkg}")
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
