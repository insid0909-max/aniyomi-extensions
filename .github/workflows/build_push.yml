name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare fixed signing key
        run: |
          # 고정된 키가 없으면 생성, 있으면 재사용
          KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -alias aniyomi -keyalg RSA -keysize 2048 -validity 10000 -storepass "aniyomi123" -keypass "aniyomi123" -dname "CN=aniyomi, OU=aniyomi, O=aniyomi, L=Unknown, S=Unknown, C=Unknown"
          fi
          
          # SHA-256 지문 추출
          SIGNING_KEY=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias aniyomi -storepass "aniyomi123" | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "SIGNING_KEY=$SIGNING_KEY" >> $GITHUB_ENV
          echo "Fixed SHA-256 Fingerprint: $SIGNING_KEY"

      - name: Build extensions
        env:
          CI_CHUNK_NUM: 0
          CI_CHUNK_SIZE: 1
          CI_SIGNING_KEY: keystore.jks
          CI_SIGNING_KEY_ALIAS: aniyomi
          CI_SIGNING_KEY_PASSWORD: aniyomi123
          CI_SIGNING_STORE_PASSWORD: aniyomi123
          SIGNING_STORE_PASSWORD: aniyomi123
          SIGNING_KEY_PASSWORD: aniyomi123
          SIGNING_KEY_ALIAS: aniyomi
        run: |
          ./gradlew :src:ko:tvroom:assembleRelease \
            -PsigningStorePassword="aniyomi123" \
            -PsigningKeyPassword="aniyomi123" \
            -PsigningKeyAlias="aniyomi" \
            -PsigningStoreFile="$GITHUB_WORKSPACE/keystore.jks" \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/keystore.jks" \
            -Pandroid.injected.signing.store.password="aniyomi123" \
            -Pandroid.injected.signing.key.alias="aniyomi" \
            -Pandroid.injected.signing.key.password="aniyomi123" \
            --stacktrace

      - name: Prepare repo, icon and index
        run: |
          mkdir -p repo/anime repo/apk repo/icon
          
          ORIG_APK=$(find . -name "*.apk" -type f ! -path "./repo/*" | head -n 1)
          echo "Found original APK: $ORIG_APK"
          
          TARGET_APK="aniyomi-ko.tvroom-v14.2-release.apk"
          PKG_NAME="eu.kanade.tachiyomi.animeextension.ko.tvroom"
          
          cp -v "$ORIG_APK" "repo/$TARGET_APK"
          cp -v "$ORIG_APK" "repo/anime/$TARGET_APK"
          cp -v "$ORIG_APK" "repo/apk/$TARGET_APK"
          
          # 아이콘 복사
          unzip -p "$ORIG_APK" "res/9w.png" > "repo/icon/${PKG_NAME}.png" || true
          cp -v "repo/icon/${PKG_NAME}.png" "repo/${PKG_NAME}.png" || true
          cp -v "repo/icon/${PKG_NAME}.png" "repo/anime/${PKG_NAME}.png" || true

          cat << 'EOF' > generate_index.py
          import os, json

          repo_dir = "repo"
          signing_key = os.environ.get("SIGNING_KEY", "")
          target_apk = "aniyomi-ko.tvroom-v14.2-release.apk"
          apk_path = os.path.join(repo_dir, target_apk)
          apk_size = os.path.getsize(apk_path) if os.path.exists(apk_path) else 0

          # 1. repo.json
          repo_data = {
              "meta": {
                  "name": "TVroom Repository",
                  "shortName": "TVroom",
                  "website": "https://github.com/insid0909-max/aniyomi-extensions",
                  "signingKeyFingerprint": signing_key
              }
          }
          with open(os.path.join(repo_dir, "repo.json"), "w", encoding="utf-8") as fp:
              json.dump(repo_data, fp, ensure_ascii=False, indent=2)
          with open(os.path.join(repo_dir, "anime", "repo.json"), "w", encoding="utf-8") as fp:
              json.dump(repo_data, fp, ensure_ascii=False, indent=2)

          # 2. index.min.json
          extensions = [{
              "name": "TVroom",
              "pkg": "eu.kanade.tachiyomi.animeextension.ko.tvroom",
              "apk": target_apk,
              "lang": "ko",
              "code": 2,
              "version": "14.2",
              "nsfw": 0,
              "hasReadme": 0,
              "hasChangelog": 0,
              "size": apk_size,
              "icon": "eu.kanade.tachiyomi.animeextension.ko.tvroom.png",
              "sources": [
                  {
                      "name": "TVroom",
                      "lang": "ko",
                      "id": 2135778533207260895,
                      "baseUrl": "https://tvwiki51.net",
                      "versionId": 1
                  }
              ]
          }]

          for p in [os.path.join(repo_dir, "index.min.json"), os.path.join(repo_dir, "anime", "index.min.json")]:
              with open(p, "w", encoding="utf-8") as fp:
                  json.dump(extensions, fp, ensure_ascii=False, separators=(',', ':'))

          print(f"Build complete. Fingerprint: {signing_key}")
          EOF

          python3 generate_index.py
          cat repo/index.min.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
