name: Combined index

# 웹툰·애니·소설 망가요미 확장 목록을 하나로 합쳐 repo 가지의 index.json 에 둠 (2026-11-09)
# master 에 두지 않는 이유: 바뀔 때마다 애니요미 빌드(build_push)가 돌지 않게
on:
  push:
    branches:
      - master
    paths:
      - 'mangayomi/anime_index.json'
      - 'mangayomi/tools/combined/**'
      - 'domains.json'
      - 'changelog.json'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combined-index
  cancel-in-progress: false

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Quick domain check
        # 30분마다 주소 목록의 주소를 두드려, 옛 주소가 같은 이름·더 큰 번호로 넘겨 주거나 안내 페이지에 더 큰 번호가 있으면
        # domains.json 을 바로 고침 (2026-11-13) → 확장이 접속 안 될 때 맨 먼저 이 목록을 보므로 스스로 옮겨 감
        # (이 작업의 푸시는 GITHUB_TOKEN 이라 애니요미 빌드는 돌지 않음 — 확장은 master raw 를 바로 읽음)
        continue-on-error: true
        run: |
          git fetch -q origin master
          git checkout -q -B quick origin/master
          OUT=$(node mangayomi/tools/combined/quickdomains.js domains.json mangayomi/tools/monitor/config.json changelog.json 업데이트내역.md mangayomi/tools/monitor/changelog.js) || true
          echo "$OUT"
          if echo "$OUT" | grep -q CHANGED; then
            git config user.name "insid0909-max"
            git config user.email "266083559+insid0909-max@users.noreply.github.com"
            git add domains.json changelog.json 업데이트내역.md
            git commit -q -m "사이트 주소 자동 갱신 (30분 확인): $(echo "$OUT" | grep '^바꿈' | sed 's/^바꿈 //' | tr '\n' ' ')"
            git push -q origin HEAD:master || echo "푸시 실패 (다음 차례에 다시)"
          fi

      - name: Combine
        run: node mangayomi/tools/combined/combine.js mangayomi/anime_index.json "$RUNNER_TEMP/out"

      - name: Publish to repo branch
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          DIR="$RUNNER_TEMP/repo"
          if git ls-remote --exit-code --heads "$REMOTE" repo >/dev/null 2>&1; then
            git clone -q --depth 1 -b repo "$REMOTE" "$DIR"
          else
            mkdir -p "$DIR" && cd "$DIR" && git init -q -b repo && git remote add origin "$REMOTE" && cd -
          fi
          cp "$RUNNER_TEMP/out/index.json" "$DIR/index.json"
          cp mangayomi/tools/combined/README.md "$DIR/README.md"
          # 확장 상태판 (2026-11-13): 감시 결과·주소·버전·업데이트 내역을 한 장으로
          node mangayomi/tools/combined/status.js . "$RUNNER_TEMP/out/상태판.md" "$DIR/상태판.md" "$DIR/status.json" > /dev/null || true
          if [ -f "$RUNNER_TEMP/out/상태판.md" ]; then cp "$RUNNER_TEMP/out/상태판.md" "$DIR/상태판.md"; fi
          if [ -f "$RUNNER_TEMP/out/status.json" ]; then cp "$RUNNER_TEMP/out/status.json" "$DIR/status.json"; fi
          cd "$DIR"
          git config user.name "insid0909-max"
          git config user.email "266083559+insid0909-max@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "합친 확장 목록 갱신"
          git push -q origin repo

      - name: Status app page on GitHub Pages
        # 앱 모양 상태판(gh-pages /status/)이 없거나 다르면 넣음 (애니요미 빌드가 gh-pages 를 바꿀 때도 같이 넣지만, 그 사이 빈틈 대비)
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          DIR="$RUNNER_TEMP/pages"
          git clone -q --depth 1 -b gh-pages "$REMOTE" "$DIR" || exit 0
          mkdir -p "$DIR/status"
          if cmp -s mangayomi/tools/combined/status.html "$DIR/status/index.html"; then echo "상태판 화면 그대로"; exit 0; fi
          cp mangayomi/tools/combined/status.html "$DIR/status/index.html"
          cd "$DIR"
          git config user.name "insid0909-max"
          git config user.email "266083559+insid0909-max@users.noreply.github.com"
          git add status/index.html
          git commit -q -m "상태판 화면 갱신"
          git push -q origin gh-pages
